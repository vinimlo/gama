<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">A guarda: onde o modelo hesita, vale a régua</title>
<desc id="d">Eixo de confiança de 0,50 a 1,00 com o limiar em 0,95. Abaixo do limiar o trecho do modelo sai e entra o da régua, se ela achou algo ali; acima vale o modelo. A mediana dos falsos positivos em ementa real fica em 0,83, abaixo do limiar. O menor dos 4.447 acertos no estresse difícil fica em 0,9993, acima dele. No estilo da organização, 4.626 documentos saem iguais com e sem a guarda. Em texto real, 305 ementas, o F1 de extração vai de 0,620 a 0,818.</desc>
<rect x="0.5" y="0.5" width="879" height="419" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="28.0" y="40.0" font-size="17" font-weight="600" fill="#0b0b0b">A guarda: onde o modelo hesita, vale a régua</text>
<text x="28.0" y="62.0" font-size="12.5" font-weight="400" fill="#52514e">Confiança do trecho: a média da probabilidade que o modelo deu ao rótulo escolhido, do Gama v1.3.</text>
<text x="581.6" y="96.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end">0,83</text>
<text x="581.6" y="112.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="end">mediana dos falsos positivos</text>
<text x="581.6" y="127.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="end">em ementa real</text>
<text x="820.0" y="96.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end">0,9993</text>
<text x="820.0" y="112.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="end">o menor dos 4.447 acertos</text>
<text x="820.0" y="127.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="end">no estresse difícil</text>
<rect x="60.0" y="148" width="683.0" height="44" fill="#f4f3ee"/>
<rect x="745.0" y="148" width="75.0" height="44" fill="#e3eefb"/>
<line x1="744.0" y1="138" x2="744.0" y2="205" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="4 3"/>
<g><title>0,83, mediana dos falsos positivos em ementa real</title><line x1="561.6" y1="134" x2="561.6" y2="163.0" stroke="#898781" stroke-width="1"/><circle cx="561.6" cy="170.0" r="6" fill="#aeaca4" stroke="#fcfcfb" stroke-width="2"/></g>
<g><title>0,9993, o menor dos 4.447 acertos no estresse difícil</title><line x1="818.9" y1="134" x2="818.9" y2="163.0" stroke="#898781" stroke-width="1"/><circle cx="818.9" cy="170.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/></g>
<line x1="60.0" y1="200" x2="820.0" y2="200" stroke="#c3c2b7"/>
<line x1="60.0" y1="200" x2="60.0" y2="205" stroke="#c3c2b7"/>
<text x="60.0" y="219.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">0,50</text>
<line x1="212.0" y1="200" x2="212.0" y2="205" stroke="#c3c2b7"/>
<text x="212.0" y="219.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">0,60</text>
<line x1="364.0" y1="200" x2="364.0" y2="205" stroke="#c3c2b7"/>
<text x="364.0" y="219.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">0,70</text>
<line x1="516.0" y1="200" x2="516.0" y2="205" stroke="#c3c2b7"/>
<text x="516.0" y="219.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">0,80</text>
<line x1="668.0" y1="200" x2="668.0" y2="205" stroke="#c3c2b7"/>
<text x="668.0" y="219.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">0,90</text>
<line x1="820.0" y1="200" x2="820.0" y2="205" stroke="#c3c2b7"/>
<text x="820.0" y="219.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">1,00</text>
<text x="744.0" y="219.0" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">limiar 0,95</text>
<text x="60.0" y="246.0" font-size="11.5" font-weight="400" fill="#52514e">abaixo do limiar: sai o trecho do modelo e entra o da régua, se ela achou algo ali</text>
<text x="820.0" y="246.0" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="end">do limiar para cima: vale o modelo</text>
<rect x="28.0" y="270.0" width="404.0" height="96.0" rx="8" fill="#f4f3ee" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="44.0" y="294.0" font-size="11.5" font-weight="400" fill="#52514e">No estilo da organização</text>
<text x="44.0" y="324.0" font-size="22" font-weight="600" fill="#0b0b0b">4.626 documentos</text>
<text x="44.0" y="348.0" font-size="11.5" font-weight="400" fill="#52514e">saem iguais com e sem a guarda: a nota oficial não muda</text>
<rect x="448.0" y="270.0" width="404.0" height="96.0" rx="8" fill="#f4f3ee" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="464.0" y="294.0" font-size="11.5" font-weight="400" fill="#52514e">Em texto real, 305 ementas, F1 de extração</text>
<text x="464.0" y="321.0" font-size="12" font-weight="400" fill="#0b0b0b">modelo sozinho</text>
<g><title>modelo sozinho: 0,620</title><rect x="568.0" y="308" width="132.7" height="18" rx="4" fill="#aeaca4"/></g>
<text x="706.7" y="321.0" font-size="12" font-weight="400" fill="#0b0b0b">0,620</text>
<text x="464.0" y="347.0" font-size="12" font-weight="600" fill="#0b0b0b">com a guarda</text>
<g><title>com a guarda: 0,818</title><rect x="568.0" y="334" width="175.1" height="18" rx="4" fill="#2a78d6"/></g>
<text x="749.1" y="347.0" font-size="12" font-weight="600" fill="#0b0b0b">0,818</text>
<text x="28.0" y="386.0" font-size="11" font-weight="400" fill="#52514e">A guarda tem mais uma regra: referência vaga a até 2 caracteres de outra citação sai, porque colada a um precedente ela é o rabo dele.</text>
<text x="28.0" y="402.0" font-size="11" font-weight="400" fill="#52514e">No estilo da organização o modelo não hesita, então nenhuma das duas regras dispara.</text>
</svg>
